<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi LC Nematik</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        h2 { color: #333; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #45a049; }
        #preview { margin-top: 20px; max-width: 100%; border-radius: 10px; display: none; }
        .result { margin-top: 20px; font-weight: bold; font-size: 1.2em; color: #2c3e50; }
    </style>
</head>
<body>

<div class="container">
    <h2>Klasifikasi Nematik</h2>
    <p>Upload gambar untuk deteksi</p>
    
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" onchange="previewImage(event)" required>
        <img id="preview">
        <br>
        <button type="submit">Prediksi Sekarang</button>
    </form>

    {% if result %}
    <div class="result">
        Hasil: {{ result }}
    </div>
    {% endif %}
</div>

<script>
    function previewImage(event) {
        var reader = new FileReader();
        reader.onload = function() {
            var output = document.getElementById('preview');
            output.src = reader.result;
            output.style.display = 'block';
        }
        reader.readAsDataURL(event.target.files[0]);
    }
</script>

</body>
</html>
